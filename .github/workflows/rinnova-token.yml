name: Rinnova token Instagram

# Il token IG dura 60 giorni: lo rinnoviamo due volte al mese.
# Il commit su ultimo-rinnovo.txt tiene anche vivo il repo
# (GitHub spegne i cron dopo 60 giorni senza commit).
on:
  schedule:
    - cron: "17 6 1,15 * *"
  workflow_dispatch:

jobs:
  rinnova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Rinnova e salva il nuovo token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          risposta=$(curl -sf -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=$IG_TOKEN")
          nuovo=$(python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])" <<< "$risposta")
          echo "::add-mask::$nuovo"
          gh secret set IG_TOKEN -R "$GITHUB_REPOSITORY" --body "$nuovo"
          giorni=$(python3 -c "import sys,json;print(json.load(sys.stdin)['expires_in']//86400)" <<< "$risposta")
          echo "Token rinnovato, valido altri $giorni giorni"
      - name: Commit di mantenimento
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > ultimo-rinnovo.txt
          git config user.name "rinnovo-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add ultimo-rinnovo.txt
          git commit -m "Rinnovo token" && git push
